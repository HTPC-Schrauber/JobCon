<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung - JobCon</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 32px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <div class="login-header">
                <h1 style="font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px;">⚡ JobCon</h1>
                <p style="color: var(--text-muted); font-size: 13px;">Talend Job Deployment & Execution Engine</p>
            </div>

            {{if .Error}}
                <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 13px;">
                    {{.Error}}
                </div>
            {{end}}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 12px; padding: 10px;">
                    Anmelden
                </button>
            </form>
        </div>
    </div>
</body>
</html>
