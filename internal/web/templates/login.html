<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung - JobCon</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--bg);
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 36px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
            position: relative;
        }
        .login-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            border-top-left-radius: var(--radius-md);
            border-top-right-radius: var(--radius-md);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-brand-mark {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: #0f0f0f;
            border-radius: var(--radius-xs);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 0 14px rgba(245, 131, 69, 0.35);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <div class="login-header">
                <div class="login-brand-mark">
                    <svg class="icon icon-lg" style="stroke: #0f0f0f; stroke-width: 2.5;" viewBox="0 0 24 24">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <h1 style="font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px;">JobCon</h1>
                <p style="color: var(--text-muted); font-size: 12px; letter-spacing: 0.02em;">Talend Job Deployment &amp; Execution Engine</p>
            </div>

            {{if .Error}}
                <div style="background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #f87171; padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 12.5px;">
                    {{.Error}}
                </div>
            {{end}}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px; font-size: 13.5px;">
                    Anmelden
                </button>
            </form>
        </div>
    </div>
</body>
</html>
