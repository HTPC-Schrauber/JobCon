# ==============================================================================
# JobCon Configuration Example (Linux)
# ==============================================================================

environment:
  name: "DEV" # Options: "DEV", "TEST", "PROD" or custom description (e.g. "Staging")
  color: "#059669" # Optional custom hex color (auto-assigned if empty: DEV=green, TEST=amber, PROD=red)
  text_color: "#ffffff" # Optional text color for the badge

i18n:
  default_language: "en" # Options: "en" or "de"
  locales_dir: "" # Optional: Path to custom directory with JSON locale files (e.g. "./locales")

server:
  bind: "0.0.0.0"
  port: 8080
  base_url: "http://localhost:8080"
  trusted_proxies:
    - "127.0.0.1/32"
    - "10.0.0.0/8"

tls:
  enabled: false # Set true if JobCon terminates TLS natively
  cert_file: "/etc/jobcon/tls/cert.pem"
  key_file: "/etc/jobcon/tls/key.pem"

auth:
  mode: "local" # Options: "local" or "ldap"
  session_secret_env: "JOBCON_SESSION_SECRET"
  ldap:
    enabled: false
    host: "ad.intern.firma.de"
    port: 636                       # Vorbelegt: 636 für LDAPS, 389 für LDAP
    use_ssl: true                   # true = LDAPS, false = LDAP
    insecure_skip_verify: false
    # Optionaler Bind-Benutzer (falls leer, erfolgt die Anmeldung direkt als Benutzer)
    bind_dn: ""                     # z.B. "CN=jobcon_svc,OU=ServiceAccounts,DC=intern,DC=firma,DC=de"
    bind_password_env: "JOBCON_LDAP_PASSWORD"
    # Optionales Bind-Muster für Direct User Bind ohne Service-Account:
    user_bind_template: "%s@intern.firma.de"  # oder "uid=%s,ou=users,dc=intern,dc=firma,dc=de"
    base_dn: "OU=Users,DC=intern,DC=firma,DC=de"
    user_filter: ""                 # optional, falls leer wird (<attr_username>=%s) genutzt
    # Attribut-Herkunft (in LDAP-Grundeinstellungen konfigurierbar):
    attr_username: "sAMAccountName" # Loginname (z. B. sAMAccountName, uid, userPrincipalName)
    attr_first_name: "givenName"    # Vorname
    attr_last_name: "sn"            # Nachname
    attr_email: "mail"              # E-Mail

database:
  path: "./data/jobcon.db"

storage:
  logs_dir: "./data/logs"
  compress_completed: true

scripts:
  dir: "./scripts" # Verzeichnis mit Zielserver-Skripten (jobcon_ctl.sh, run_job.sh)

nexus:
  base_url: "https://nexus.intern.firma.de/repository"
  username: "nexus_talend_reader"
  password_env: "JOBCON_NEXUS_PASSWORD"

ssh_defaults:
  user: "talend"
  key_path: "~/.ssh/id_ed25519"
  timeout_seconds: 30
  keepalive_interval_seconds: 30
