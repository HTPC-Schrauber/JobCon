<!DOCTYPE html>
<html>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.form-group { margin-bottom: 14px; width: 300px; background: #333; padding: 10px; }
input[type="text"], select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #555;
}
</style>
<body>
<div class="form-group">
  <select><option>Option 1</option></select>
</div>
<div class="form-group">
  <div style="display: flex; gap: 8px;">
    <input type="text" style="flex: 1;" placeholder="test">
  </div>
</div>
</body>
</html>
